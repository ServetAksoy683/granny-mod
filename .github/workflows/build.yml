name: build-mod
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build classes6.dex
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          JAR="$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)/android.jar"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "android.jar: $JAR"
          echo "build-tools: $BT"
          mkdir -p out/classes out/lib/arm64-v8a
          javac -source 8 -target 8 -Xlint:-options -cp "$JAR" -d out/classes $(find java -name '*.java')
          "$BT/d8" --release --min-api 24 --lib "$JAR" --output out $(find out/classes -name '*.class')
          mv out/classes.dex out/classes6.dex

      - name: Build libmodlib.so
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "NDK: $NDK"
          cmake -S native -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          cp build/libmodlib.so out/lib/arm64-v8a/libmodlib.so
          ls -l out out/lib/arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: mod-files
          path: |
            out/classes6.dex
            out/lib/arm64-v8a/libmodlib.so
