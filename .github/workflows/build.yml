name: build-dex
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build classes6.dex
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          JAR="$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)/android.jar"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "android.jar: $JAR"
          echo "build-tools: $BT"
          mkdir -p out/classes
          javac -source 8 -target 8 -Xlint:-options -cp "$JAR" -d out/classes $(find java -name '*.java')
          "$BT/d8" --release --min-api 24 --lib "$JAR" --output out $(find out/classes -name '*.class')
          mv out/classes.dex out/classes6.dex
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: classes6-dex
          path: out/classes6.dex
